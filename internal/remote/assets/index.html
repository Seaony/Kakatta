<!doctype html>
<html lang="{{.Current.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="viewer.css">
<title>{{.Current.Text.title}} · Kakatta</title>
</head>
<body>
<header>
    <div><strong id="viewer-heading">{{.Current.Text.title}}</strong><span id="status" role="status">{{.Current.Text.connecting}}</span></div>
    <nav id="viewer-toolbar" aria-label="{{.Current.Text.toolbar}}">
        <button id="actual" disabled>{{.Current.Text.actual}}</button>
        <button id="fit" disabled>{{.Current.Text.fit}}</button>
        <button id="pan" aria-pressed="false" disabled>{{.Current.Text.pan}}</button>
        <button id="text-toggle" aria-expanded="false" aria-controls="text-entry" disabled>{{.Current.Text.text_toggle}}</button>
    </nav>
</header>
<p id="help">{{.Current.Text.initial_help}}</p>
<section id="text-entry" hidden aria-label="{{.Current.Text.text_entry}}">
    <label id="text-label" for="text-input">{{.Current.Text.text_label}}</label>
    <p id="text-help">{{.Current.Text.text_help}}</p>
    <textarea id="text-input" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-describedby="text-help"></textarea>
    <div class="text-actions"><button id="text-send" disabled>{{.Current.Text.text_send}}</button><button id="text-backspace">{{.Current.Text.text_backspace}}</button><button id="text-enter">{{.Current.Text.text_enter}}</button><button id="text-close">{{.Current.Text.text_close}}</button><span id="text-status" role="status"></span></div>
</section>
<div id="screen" aria-label="{{.Current.Text.screen}}"></div>
<template id="viewer-copy">
{{range .Copies}}<span lang="{{.Lang}}" data-title="{{.Text.title}}" data-connecting="{{.Text.connecting}}" data-connected="{{.Text.connected}}" data-disconnected="{{.Text.disconnected}}" data-connection-failed="{{.Text.connection_failed}}" data-toolbar="{{.Text.toolbar}}" data-actual="{{.Text.actual}}" data-fit="{{.Text.fit}}" data-pan="{{.Text.pan}}" data-resume="{{.Text.resume}}" data-text-toggle="{{.Text.text_toggle}}" data-initial-help="{{.Text.initial_help}}" data-text-entry="{{.Text.text_entry}}" data-text-label="{{.Text.text_label}}" data-text-help="{{.Text.text_help}}" data-text-send="{{.Text.text_send}}" data-text-backspace="{{.Text.text_backspace}}" data-text-enter="{{.Text.text_enter}}" data-text-close="{{.Text.text_close}}" data-screen="{{.Text.screen}}" data-canvas="{{.Text.canvas}}" data-help-pan="{{.Text.help_pan}}" data-help-control="{{.Text.help_control}}" data-help-verification="{{.Text.help_verification}}" data-help-position-unavailable="{{.Text.help_position_unavailable}}" data-help-disconnected="{{.Text.help_disconnected}}" data-text-sent="{{.Text.text_sent}}"></span>
{{end}}</template>
<script type="module" src="viewer.js"></script>
</body>
</html>
