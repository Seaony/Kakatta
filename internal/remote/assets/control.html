<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>可行性实验 · Kakatta</title>
<style>{{style}}</style>
</head>
<body>
<header><div><h1>Kakatta 可行性实验</h1><p>一次搜索，最多三个详情。登录和验证由你自己完成。</p></div><span id="phase" role="status">请先登录</span></header>
<main>
<section id="login" aria-label="实验访问令牌">
    <form id="auth-form"><label for="token">容器日志里的访问令牌</label><div class="form-row"><input id="token" name="token" type="password" autocomplete="off" required><button type="submit">进入实验</button></div></form>
</section>
<section id="controls" hidden aria-label="实验操作">
    <div class="actions"><button id="session">打开登录画面</button><button id="run" class="primary" disabled>跑一次流程</button><button id="verify" hidden>打开验证画面</button><button id="confirm" hidden>验证已完成</button><button id="close" disabled>结束并关闭浏览器</button></div>
    <p id="hint">登录与搜索分开进行。先打开画面，自己点击登录并扫码。不要用主力账号。</p>
    <p id="reason" hidden></p><p id="next-allowed" hidden></p>
</section>
<p id="error" role="alert" hidden></p>
<section id="remote" hidden aria-label="远程浏览器"><iframe title="浏览器远程画面" src="about:blank"></iframe></section>
<section id="log-section" hidden aria-label="实验记录"><h2>本次记录</h2><ol id="events"></ol></section>
</main>
<script type="module">{{script}}</script>
</body>
</html>
